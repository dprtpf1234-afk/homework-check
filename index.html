<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>과제물 제출</title>
<style>
  :root {
    --bg: #f4f6fb; --card: #fff; --ink: #1d2433; --sub: #5f6b80; --line: #dfe4ee;
    --brand: #2f6fed; --brand-soft: #e7efff; --ok: #1f9d55; --ok-soft: #e3f6ea; --warn: #b45309;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  body { min-height: 100vh; user-select: none; -webkit-user-select: none; }
  button { font-family: inherit; }
  header { display: flex; align-items: center; justify-content: space-between;
    padding: 16px 28px; background: var(--card); border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 26px; }
  header h1 small { font-size: 17px; color: var(--sub); font-weight: 500; margin-left: 8px; }
  /* 관리자 진입 공간: 시계를 누르면 비밀번호 입력 */
  #adminSpot { background: none; border: 0; padding: 8px 4px 8px 24px; font-size: 20px; color: var(--sub);
    font-variant-numeric: tabular-nums; cursor: pointer; }
  .demo { background: #fff4d6; color: #7a5200; text-align: center; padding: 5px; font-size: 13px; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 24px 130px; }
  h2 { font-size: 24px; margin: 8px 0 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  h2 b { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 50%;
    background: var(--brand); color: #fff; font-size: 20px; }
  h2 small { font-size: 17px; color: var(--sub); font-weight: 500; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .stu { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 18px 10px;
    font-size: 24px; font-weight: 700; cursor: pointer; color: var(--ink); display: flex; flex-direction: column;
    align-items: center; gap: 4px; transition: transform .08s, border-color .15s; }
  .stu span { font-size: 15px; color: var(--sub); font-weight: 500; }
  .stu:active { transform: scale(.96); border-color: var(--brand); }

  .who { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--brand-soft);
    border-radius: 16px; padding: 16px 22px; margin-bottom: 24px; font-size: 22px; }
  .who strong { font-size: 28px; }
  .btn-ghost { font-size: 18px; border: 2px solid var(--brand); color: var(--brand); background: #fff;
    border-radius: 12px; padding: 10px 18px; cursor: pointer; white-space: nowrap; }

  .tasks { display: grid; gap: 12px; }
  .task { display: flex; align-items: center; gap: 16px; background: var(--card); border: 2px solid var(--line);
    border-radius: 16px; padding: 20px 22px; font-size: 22px; cursor: pointer; text-align: left; color: var(--ink); }
  .task .box { flex: none; width: 34px; height: 34px; border-radius: 10px; border: 3px solid #b8c2d6;
    display: grid; place-items: center; color: #fff; font-size: 22px; font-weight: 900; }
  .task .name { flex: 1; font-weight: 700; }
  .task .due { font-size: 16px; color: var(--sub); white-space: nowrap; }
  .task .due.late { color: #c0392b; font-weight: 700; }
  .task.on { border-color: var(--brand); background: var(--brand-soft); }
  .task.on .box { background: var(--brand); border-color: var(--brand); }
  .task.done { cursor: default; background: #f1f3f7; color: #8a94a6; }
  .task.done .box { background: var(--ok); border-color: var(--ok); }
  .task .tag { font-size: 15px; font-weight: 700; color: var(--ok); background: var(--ok-soft); border-radius: 999px; padding: 4px 12px; white-space: nowrap; }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
    padding: 16px 24px; display: flex; justify-content: center; }
  #submitBtn { width: min(560px, 100%); font-size: 26px; font-weight: 800; padding: 20px; border: 0;
    border-radius: 18px; background: var(--brand); color: #fff; cursor: pointer; }
  #submitBtn:disabled { background: #c3cbdb; cursor: default; }

  #done { text-align: center; padding-top: 60px; cursor: pointer; }
  #done .check { width: 140px; height: 140px; border-radius: 50%; background: var(--ok); color: #fff; font-size: 90px;
    display: grid; place-items: center; margin: 0 auto 24px; animation: pop .35s ease-out; }
  #done h3 { font-size: 34px; margin: 0 0 16px; }
  #done ul { list-style: none; padding: 0; margin: 0 0 16px; font-size: 22px; line-height: 1.7; }
  #done .note { color: var(--warn); font-size: 18px; }
  #done .back { color: var(--sub); font-size: 18px; margin-top: 28px; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .msg { text-align: center; color: var(--sub); font-size: 20px; padding: 60px 0; line-height: 1.6; }
  .err { color: #c0392b; }

  /* 비밀번호 키패드 */
  .modal { position: fixed; inset: 0; background: rgba(15,23,42,.55); display: grid; place-items: center; z-index: 50; padding: 16px; }
  .pinbox { background: #fff; border-radius: 22px; padding: 24px; width: min(360px, 100%); text-align: center; }
  .pinbox h3 { margin: 0 0 14px; font-size: 21px; }
  .dots { display: flex; justify-content: center; gap: 12px; height: 22px; margin-bottom: 8px; }
  .dots i { width: 16px; height: 16px; border-radius: 50%; background: var(--brand); }
  .dots.shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  #pinMsg { min-height: 20px; color: #c0392b; font-size: 14px; margin-bottom: 8px; }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .pad button { font-size: 26px; padding: 14px 0; border-radius: 14px; border: 1px solid var(--line); background: #f8f9fc; cursor: pointer; color: var(--ink); }
  .pad button:active { background: var(--brand-soft); }
  .pad .ok { background: var(--brand); color: #fff; border: 0; font-size: 20px; font-weight: 700; }
  .pad .fn { font-size: 18px; color: var(--sub); }
  .close { margin-top: 12px; background: none; border: 0; color: var(--sub); font-size: 16px; cursor: pointer; padding: 8px; }

  [hidden] { display: none !important; }
  /* 첫 화면 */
  #home { min-height: calc(100vh - 220px); display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 48px; }
  #home .ask { margin: 0; font-size: clamp(40px, 8vw, 84px); font-weight: 900; letter-spacing: -1px; line-height: 1.25; word-break: keep-all; }
  #home .ask span { color: var(--brand); }
  #startBtn { width: min(480px, 100%); font-size: 32px; font-weight: 800; padding: 26px; border: 0; border-radius: 22px;
    background: var(--brand); color: #fff; cursor: pointer; box-shadow: 0 10px 24px rgba(47,111,237,.3); transition: transform .08s; }
  #startBtn:active { transform: scale(.97); }
  .steptop { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .steptop h2 { margin-bottom: 20px; }

  @media (max-width: 600px) {
    #home { gap: 32px; } #startBtn { font-size: 26px; padding: 20px; }
    header { padding: 12px 16px; } header h1 { font-size: 20px; } header h1 small { display: none; }
    #adminSpot { font-size: 16px; }
    main { padding: 16px 16px 120px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
    .stu { font-size: 19px; } .task { font-size: 18px; padding: 16px; gap: 12px; }
    .who { font-size: 18px; padding: 12px 14px; } .who strong { font-size: 22px; }
  }
</style>
</head>
<body>
<div id="demoBanner" class="demo" hidden>데모 모드 — 구글 스프레드시트 연동 전입니다 (관리자 페이지 › 설정에서 연동)</div>
<header>
  <h1>📮 <span id="title">과제물 제출</span><small id="className"></small></h1>
  <button id="adminSpot" aria-label="시계"></button>
</header>

<main>
  <div id="loading" class="msg">명단을 불러오는 중…</div>

  <section id="home" hidden>
    <p class="ask">너 그거 <span>제출</span>했어?</p>
    <button id="startBtn">제출하기</button>
  </section>

  <section id="step1" hidden>
    <div class="steptop">
      <h2><b>1</b> 내 이름을 눌러 주세요</h2>
      <button class="btn-ghost" id="homeBtn">← 처음으로</button>
    </div>
    <div id="students" class="grid"></div>
  </section>

  <section id="step2" hidden>
    <div class="who">
      <div><span id="whoNo"></span>번 <strong id="whoName"></strong> 학생</div>
      <button class="btn-ghost" id="backBtn">← 내가 아니에요</button>
    </div>
    <h2><b>2</b> 제출할 것을 고르세요 <small>(여러 개 선택 가능)</small></h2>
    <div id="tasks" class="tasks"></div>
    <div class="bar"><button id="submitBtn" disabled>제출하기</button></div>
  </section>

  <section id="done" hidden>
    <div class="check">✓</div>
    <h3 id="doneTitle"></h3>
    <ul id="doneList"></ul>
    <div id="doneNote" class="note"></div>
    <div class="back"><span id="countdown">5</span>초 후 처음 화면으로 돌아갑니다 · 화면을 누르면 바로 돌아가요</div>
  </section>
</main>

<div id="pinModal" class="modal" hidden>
  <div class="pinbox">
    <h3>🔒 관리자 비밀번호</h3>
    <div class="dots" id="dots"></div>
    <div id="pinMsg"></div>
    <div class="pad" id="pad">
      <button>1</button><button>2</button><button>3</button>
      <button>4</button><button>5</button><button>6</button>
      <button>7</button><button>8</button><button>9</button>
      <button class="fn" data-k="del">지움</button><button>0</button><button class="ok" data-k="ok">확인</button>
    </div>
    <button class="close" id="pinClose">닫기</button>
  </div>
</div>

<script>document.write('<script src="config.js?t=' + Date.now() + '"><\/script>');</script>
<script src="assets/api.js"></script>
<script>
const $ = id => document.getElementById(id);
const { esc, CFG, session } = U;
let data = null, me = null, picked = new Set(), busy = false, idleTimer = null, doneTimer = null;

$('title').textContent = CFG.title || '과제물 제출';
$('className').textContent = CFG.className || '';
document.title = (CFG.className ? CFG.className + ' ' : '') + (CFG.title || '과제물 제출');
$('demoBanner').hidden = !Api.isDemo;

function tick() {
  const d = new Date();
  $('adminSpot').textContent = d.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' }) + ' ' +
    d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
}
tick(); setInterval(tick, 10000);

function show(id) {
  ['loading', 'home', 'step1', 'step2', 'done'].forEach(s => $(s).hidden = s !== id);
  window.scrollTo(0, 0);
}

async function load(quiet) {
  try {
    data = await Api.call('getStudentData');
    renderStudents();
    if (!$('loading').hidden) show('home');
  } catch (e) {
    if (quiet && data) return;
    $('loading').innerHTML = `<span class="err">불러오기 실패: ${esc(e.message || e)}</span><br>선생님께 알려 주세요.`;
    show('loading');
  }
}

function renderStudents() {
  $('students').innerHTML = data.students.length
    ? data.students.map((s, i) => `<button class="stu" data-i="${i}">${esc(s.name)}<span>${esc(s.no)}번</span></button>`).join('')
    : '<div class="msg" style="grid-column:1/-1">등록된 학생이 없습니다.<br>선생님이 관리자 페이지에서 명단을 등록해 주세요.</div>';
}

// 첫 화면 → 학생 명단
$('startBtn').addEventListener('click', () => { show('step1'); armIdle(); });
$('homeBtn').addEventListener('click', reset);

$('students').addEventListener('click', e => {
  const b = e.target.closest('.stu');
  if (!b) return;
  me = data.students[+b.dataset.i];
  picked.clear();
  renderTasks();
  show('step2');
  armIdle();
});

function renderTasks() {
  $('whoNo').textContent = me.no;
  $('whoName').textContent = me.name;
  const done = new Set(data.records.filter(r => r.no === me.no && r.name === me.name).map(r => r.task));
  const today = U.fmt(new Date()).slice(0, 10);
  $('tasks').innerHTML = data.tasks.map((t, i) => {
    const isDone = done.has(t.name), on = picked.has(t.name);
    const late = /^\d{4}-\d{2}-\d{2}$/.test(t.due) && t.due < today;
    const side = isDone ? '<span class="tag">제출 완료</span>'
      : t.due ? `<span class="due ${late ? 'late' : ''}">마감 ${esc(U.due(t.due))}${late ? ' 지남' : ''}</span>` : '';
    return `<button class="task ${isDone ? 'done' : on ? 'on' : ''}" data-i="${i}" ${isDone ? 'disabled' : ''}>
      <span class="box">${isDone || on ? '✓' : ''}</span><span class="name">${esc(t.name)}</span>${side}</button>`;
  }).join('') || '<div class="msg">지금 받는 과제물이 없습니다.</div>';
  $('submitBtn').disabled = picked.size === 0;
  $('submitBtn').textContent = picked.size ? `${picked.size}개 제출하기` : '제출할 것을 선택하세요';
}

$('tasks').addEventListener('click', e => {
  const b = e.target.closest('.task');
  if (!b || b.disabled) return;
  const name = data.tasks[+b.dataset.i].name;
  picked.has(name) ? picked.delete(name) : picked.add(name);
  renderTasks();
  armIdle();
});

$('backBtn').addEventListener('click', reset);

$('submitBtn').addEventListener('click', async () => {
  if (busy || !picked.size) return;
  busy = true;
  clearTimeout(idleTimer);
  $('submitBtn').disabled = true;
  $('submitBtn').textContent = '제출하는 중…';
  try {
    const res = await Api.call('submit', { no: me.no, name: me.name, tasks: [...picked] });
    res.added.forEach(task => data.records.push({ no: me.no, name: me.name, task }));
    $('doneTitle').textContent = `${me.name} 학생, 제출 완료!`;
    $('doneList').innerHTML = res.added.map(t => `<li>✅ ${esc(t)}</li>`).join('');
    $('doneNote').textContent = res.dups.length ? `이미 제출되어 있던 항목: ${res.dups.join(', ')}` : '';
    show('done');
    let n = 5;
    $('countdown').textContent = n;
    doneTimer = setInterval(() => { $('countdown').textContent = --n; if (n <= 0) reset(); }, 1000);
  } catch (e) {
    alert('제출하지 못했습니다: ' + (e.message || e) + '\n다시 시도하거나 선생님께 알려 주세요.');
    renderTasks();
    armIdle();
  } finally {
    busy = false;
  }
});

$('done').addEventListener('click', reset);

function reset() {
  clearInterval(doneTimer);
  clearTimeout(idleTimer);
  me = null;
  picked.clear();
  if (data) show('home');
  load(true); // 다른 태블릿·교사 처리분까지 최신으로
}

// 이름만 누르고 자리를 떠나면 60초 뒤 처음 화면으로
function armIdle() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(reset, 60000);
}

// 5분마다 과제 목록 갱신 (교사가 추가/삭제한 과제 반영)
setInterval(() => { if (!me) load(true); }, 300000);

/* ───── 관리자 진입: 시계를 누르면 비밀번호 키패드 ───── */
let pin = '';
function drawDots() { $('dots').innerHTML = '<i></i>'.repeat(pin.length); }
function openPin() { pin = ''; drawDots(); $('pinMsg').textContent = ''; $('pinModal').hidden = false; clearTimeout(idleTimer); }
function closePin() { $('pinModal').hidden = true; pin = ''; if (me) armIdle(); }
$('adminSpot').addEventListener('click', openPin);
$('pinClose').addEventListener('click', closePin);
$('pinModal').addEventListener('click', e => { if (e.target.id === 'pinModal') closePin(); });

$('pad').addEventListener('click', async e => {
  const b = e.target.closest('button');
  if (!b) return;
  const k = b.dataset.k;
  if (k === 'del') pin = pin.slice(0, -1);
  else if (k === 'ok') return checkPin();
  else if (pin.length < 8) pin += b.textContent;
  $('pinMsg').textContent = '';
  drawDots();
});

async function checkPin() {
  if (!pin) return;
  $('pinMsg').style.color = '#5f6b80';
  $('pinMsg').textContent = '확인 중…';
  try {
    await Api.call('verifyPin', { pin });
    session.set('adminPin', pin);
    location.href = 'admin.html';
  } catch (e) {
    $('pinMsg').style.color = '';
    $('pinMsg').textContent = e.message || String(e);
    $('dots').classList.remove('shake'); void $('dots').offsetWidth; $('dots').classList.add('shake');
    pin = ''; drawDots();
  }
}

load();
</script>
</body>
</html>
